apiVersion: 1

providers:
  - name: 'Bookstore Dashboards'
    orgId: 1
    folder: 'Bookstore'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
  - name: 'Kubernetes Dashboards'
    orgId: 1
    folder: 'Kubernetes'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards

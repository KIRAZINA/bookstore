spring:
  application:
    name: bookstore

  datasource:
    url: jdbc:postgresql://localhost:5432/bookstore
    username: bookstore
    password: bookstore

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  mail:
    # Uncomment to enable SMTP email sending:
    # host: localhost
    # port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2000
      timeout: 2000

  cache:
    type: redis

app:
  cache:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans,env,configprops,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    env:
      access: read_only
    configprops:
      access: read_only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    java-version: ${java.version}

jwt:
  secret: mySecretKeyForBookstoreApplication12345
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.bookstore: DEBUG
    org.hibernate.SQL: WARN

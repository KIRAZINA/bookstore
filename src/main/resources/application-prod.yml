spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DATASOURCE_USERNAME:bookstore}
    password: ${DATASOURCE_PASSWORD:bookstore}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000}
      timeout: ${REDIS_TIMEOUT:2000}

  cache:
    type: redis

app:
  cache:
    enabled: true

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod
    export:
      prometheus:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    java-version: ${java.version}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.example.bookstore: INFO
    org.hibernate.SQL: INFO

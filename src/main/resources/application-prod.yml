spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DATASOURCE_USERNAME:bookstore}
    password: ${DATASOURCE_PASSWORD:bookstore}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.example.bookstore: INFO
    org.hibernate.SQL: INFO

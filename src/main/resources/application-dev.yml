spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://bookstore-postgres:5432/bookstore}
    username: ${DATASOURCE_USERNAME:bookstore}
    password: ${DATASOURCE_PASSWORD:bookstore}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:bookstore-redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000}
      timeout: ${REDIS_TIMEOUT:2000}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:bookstore-kafka:9092}

app:
  cache:
    enabled: true
  rate-limiting:
    enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  inventory:
    thresholds:
      low: 10
      critical: 3
    cache-ttl-seconds: 60
  outbox:
    poll-interval: 1000
    max-retries: 5
    batch-size: 100

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans,env,configprops,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
    metrics:
      access: read_only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: dev
    export:
      prometheus:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    java-version: ${java.version}
    environment: dev

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-that-is-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:1800000}
  clock-skew-seconds: 30

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.example.bookstore: DEBUG
    AUDIT: INFO
    org.hibernate.SQL: WARN
    io.opentelemetry: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] [%X{trace_id}] [%X{span_id}] - %msg%n"

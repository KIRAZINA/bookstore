spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000}
      timeout: ${REDIS_TIMEOUT:2000}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  cache:
    enabled: true
  rate-limiting:
    enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: read_only
    metrics:
      access: read_only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: staging
    export:
      prometheus:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    java-version: ${java.version}
    environment: staging

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}
  clock-skew-seconds: 30

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.example.bookstore: INFO
    AUDIT: INFO
    org.hibernate.SQL: WARN
    io.opentelemetry: WARN

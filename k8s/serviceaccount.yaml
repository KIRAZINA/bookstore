apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore
  namespace: bookstore
  labels:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api
  annotations:
    # Future: IAM roles for service accounts (AWS IRSA, Azure Workload Identity, GCP GKE Workload Identity)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/bookstore-api
    # azure.workload.identity/client-id: CLIENT_ID
    # iam.gke.io/gcp-service-account: bookstore-api@PROJECT.iam.gserviceaccount.com
    description: "Service account for bookstore API pods with minimal permissions"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookstore-reader
  namespace: bookstore
  labels:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api
rules:
  # Read access to endpoints for actuator health checks and Eureka-like discovery
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # Read access to configmaps for dynamic configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookstore-reader-binding
  namespace: bookstore
  labels:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: bookstore
    namespace: bookstore
roleRef:
  apiGroup: rbac.authorization.k8s.io/v1
  kind: Role
  name: bookstore-reader

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore
  namespace: bookstore
  labels:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.0.1-SNAPSHOT"
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Link to source repository for troubleshooting
    app.kubernetes.io/repository: "https://github.com/example/bookstore"
    # Required for ConfigMap/Secret rolling updates
    # Deployment triggers rolling update when ConfigMap content changes
    configmap.reloader.stakater.com/reload: "bookstore-config"
    secret.reloader.stakater.com/reload: "bookstore-secrets"
spec:
  # === High Availability ===
  # Minimum 3 replicas for:
  # 1. Tolerance to single node failure
  # 2. Zero-downtime rolling updates
  # 3. Load balancing across availability zones
  replicas: 3

  # === Deployment Strategy: Rolling Update ===
  # Zero-downtime deployment with:
  # - maxSurge: 1 extra pod during update (total 4 during rollout)
  # - maxUnavailable: 0 ensures no downtime during updates
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Pod anti-affinity spreads pods across nodes for HA
  # topologyKey: kubernetes.io/hostname ensures pods run on different nodes
  # Required rule: enforce at scheduler level
  # Soft rule: prefer different zones when possible
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore
      app.kubernetes.io/component: api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.0.1-SNAPSHOT"
        # Prometheus operator auto-discovery label
        metrics: prometheus
      annotations:
        # Prometheus operator scrape configuration
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
        # OpenTelemetry sidecar injection (future)
        # sidecar.opentelemetry.io/inject: "true"
    spec:
      # === Service Account with minimal permissions ===
      serviceAccountName: bookstore
      automountServiceAccountToken: true

      # === Priority ===
      priorityClassName: bookstore-critical

      # === Pod Disruption Budget ===
      # PDB is defined in pdb.yaml

      # === Graceful Shutdown ===
      # Spring Boot default graceful shutdown timeout is 30s
      # Pod termination grace period should exceed Spring's timeout
      # to allow the health check to fail before SIGKILL
      terminationGracePeriodSeconds: 60

      # === Pod Anti-Affinity ===
      # Ensures high availability by spreading pods across nodes
      affinity:
        podAntiAffinity:
          # Preferred: spread across nodes (soft constraint)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - bookstore
                topologyKey: kubernetes.io/hostname
          # Preferred: spread across zones (soft constraint)
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - bookstore
                topologyKey: topology.kubernetes.io/zone

      # === Node Selection ===
      # Use dedicated node pool for critical workloads (future)
      # nodeSelector:
      #   node-pool: application

      # === Tolerations ===
      # Tolerate spot/preemptible VMs (future)
      # tolerations:
      #   - key: "spot"
      #     operator: "Exists"
      #     effect: "NoSchedule"

      # === Init Containers ===
      # Flyway migration runs as an init container before the main app starts
      # This ensures database schema is up-to-date before app instances accept traffic
      # Downside: slightly longer startup time, but guarantees schema consistency
      initContainers:
        - name: flyway-migration
          image: bookstore:latest
          imagePullPolicy: IfNotPresent
          # Use the same image but run only Flyway migration
          command:
            - "sh"
            - "-c"
            - |
              exec java \
                -Dspring.flyway.enabled=true \
                -Dspring.flyway.baseline-on-migrate=true \
                -Dspring.jpa.hibernate.ddl-auto=none \
                -Dspring.datasource.url=${DATASOURCE_URL} \
                -Dspring.datasource.username=${DATASOURCE_USERNAME} \
                -Dspring.datasource.password=${DATASOURCE_PASSWORD} \
                -jar /app/app.jar \
                --spring.batch.job.enabled=false \
                --spring.main.web-application-type=none
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault

      # === Application Containers ===
      containers:
        - name: bookstore
          image: bookstore:latest
          imagePullPolicy: IfNotPresent
          # === Lifecycle Hooks ===
          # preStop: 15s delay before SIGTERM allows:
          # 1. Load balancer to remove pod from rotation
          # 2. In-flight requests to complete
          lifecycle:
            preStop:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - |
                    echo "PreStop hook: sleeping 15s for load balancer drain..."
                    sleep 15
                    echo "PreStop hook: complete, proceeding with shutdown"

          # === Kubernetes Probes ===
          # All probes use Spring Boot Actuator health endpoints
          #
          # Startup Probe:
          #   - Runs first, blocks readiness/liveness until successful
          #   - Prevents premature traffic routing during slow starts
          #   - 90s failure threshold (18 failures × 5s period)
          #
          # Readiness Probe:
          #   - Checks if the pod can accept traffic
          #   - Spring checks: DB connection, Redis, Kafka, disk space
          #   - Traffic stops when probe fails (pod removed from Service endpoints)
          #
          # Liveness Probe:
          #   - Checks if the pod is alive (not in a deadlock/hang state)
          #   - Only checks liveness state (not dependent service availability)
          #   - Pod restarts when probe fails
          startupProbe:
            httpGet:
              path: /actuator/health/startup
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18  # 90s total before restart

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3  # 30s before removing from service

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3  # 45s before restart

          # === Environment Configuration ===
          # ConfigMap: non-sensitive application configuration
          # Secret: sensitive credentials
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secrets

          # === Resource Management ===
          # CPU request: 1 core (guaranteed minimum)
          # CPU limit: 2 cores (burst up to 2 during spikes)
          # Memory request: 1Gi (guaranteed minimum)
          # Memory limit: 2Gi (OOM-killed if exceeded)
          #
          # Rationale:
          # - Spring Boot + JVM overhead ~500MB baseline
          # - Heap: ~1GB for typical workloads
          # - Limit = 2× request for burst capacity
          # - Avoid setting memory request = limit to prevent OOM on GC spikes
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"

          # === Container Security Context ===
          # Non-root execution
          # Read-only root filesystem (write to /tmp for temp files)
          # Drop all Linux capabilities
          # Seccomp profile: RuntimeDefault (Kubernetes 1.19+)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Read-only root filesystem prevents:
            # 1. Malicious binary writes
            # 2. Log tampering
            # 3. Configuration modification
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            # Seccomp: restrict system calls to known-good set
            seccompProfile:
              type: RuntimeDefault

          # === Volume Mounts ===
          # /tmp: writable temp directory for JVM and OTEL
          # /app/logs: application logs (future)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      # === Volumes ===
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: "256Mi"
        - name: app-logs
          emptyDir:
            sizeLimit: "128Mi"

      # === Pod Security ===
      # Enforce baseline Pod Security Standards
      # PodSecurity admission is configured at namespace level
      securityContext:
        # Default seccomp profile for all containers
        seccompProfile:
          type: RuntimeDefault
        # Default runAs for containers that don't specify
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: dashboard
    spec:
      priorityClassName: bookstore-monitoring
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password
            - name: GF_INSTALL_PLUGINS
              value: ""
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.bookstore.example.com"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: kubernetes-dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: alerts
              mountPath: /etc/grafana/provisioning/alerting
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 472
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-storage
            - name: dashboards
              configMap:
                name: grafana-dashboards
            - name: kubernetes-dashboards
              configMap:
                name: grafana-kubernetes-dashboards
            - name: datasources
              configMap:
                name: grafana-datasources
            - name: alerts
              configMap:
                name: grafana-alerting
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
            options:
              path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-kubernetes-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  kubernetes-cluster.json: |
    {
      "title": "Bookstore - Kubernetes Cluster Overview",
      "uid": "bookstore-k8s-cluster",
      "schemaVersion": 39,
      "tags": ["bookstore", "kubernetes"],
      "timezone": "utc",
      "editable": false,
      "panels": [
        {"title":"Cluster CPU Usage","type":"gauge","datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":70},{"color":"red","value":90}]}}},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"bookstore\"}[5m])) / sum(kube_pod_container_resource_limits_cpu_cores{namespace=\"bookstore\"}) * 100"}],"gridPos":{"h":8,"w":6,"x":0,"y":0}},
        {"title":"Cluster Memory Usage","type":"gauge","datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":70},{"color":"red","value":90}]}}},"targets":[{"expr":"sum(container_memory_working_set_bytes{namespace=\"bookstore\"}) / sum(kube_pod_container_resource_limits_memory_bytes{namespace=\"bookstore\"}) * 100"}],"gridPos":{"h":8,"w":6,"x":6,"y":0}},
        {"title":"Pod Restarts (24h)","type":"bargauge","datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"none","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":3},{"color":"red","value":10}]}}},"targets":[{"expr":"sum by(pod) (kube_pod_container_status_restarts_total{namespace=\"bookstore\"})"}],"gridPos":{"h":8,"w":6,"x":12,"y":0}},
        {"title":"CPU Usage by Pod","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by(pod) (rate(container_cpu_usage_seconds_total{namespace=\"bookstore\"}[5m]))"}],"gridPos":{"h":8,"w":12,"x":0,"y":8}},
        {"title":"Memory Usage by Pod","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by(pod) (container_memory_working_set_bytes{namespace=\"bookstore\"})"}],"gridPos":{"h":8,"w":12,"x":12,"y":8}}
      ]
    }
  bookstore-application.json: |
    {
      "title": "Bookstore - Application Performance",
      "uid": "bookstore-app-perf",
      "schemaVersion": 39,
      "tags": ["bookstore", "application"],
      "timezone": "utc",
      "editable": false,
      "panels": [
        {"title":"HTTP Request Rate","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(http_server_requests_seconds_count{application=\"bookstore-api\"}[5m]))"}],"gridPos":{"h":8,"w":12,"x":0,"y":0}},
        {"title":"P99/P95/P50 Latency","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=\"bookstore-api\"}[5m])) by (le))"},{"expr":"histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"bookstore-api\"}[5m])) by (le))"},{"expr":"histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{application=\"bookstore-api\"}[5m])) by (le))"}],"gridPos":{"h":8,"w":12,"x":12,"y":0}},
        {"title":"JVM Heap Memory","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by(instance) (jvm_memory_used_bytes{application=\"bookstore-api\", area=\"heap\"})"},{"expr":"sum by(instance) (jvm_memory_max_bytes{application=\"bookstore-api\", area=\"heap\"})"}],"gridPos":{"h":8,"w":12,"x":0,"y":8}},
        {"title":"JVM Garbage Collection","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(jvm_gc_pause_seconds_sum{application=\"bookstore-api\"}[5m])"},{"expr":"rate(jvm_gc_pause_seconds_count{application=\"bookstore-api\"}[5m])"}],"gridPos":{"h":8,"w":12,"x":12,"y":8}},
        {"title":"Database Connection Pool","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"hikaricp_connections_active{application=\"bookstore-api\"}"},{"expr":"hikaricp_connections_idle{application=\"bookstore-api\"}"}],"gridPos":{"h":8,"w":12,"x":0,"y":16}},
        {"title":"Cache Hit/Miss Ratio","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(cache_gets_total{application=\"bookstore-api\"}[5m])"},{"expr":"rate(cache_hits_total{application=\"bookstore-api\"}[5m])"},{"expr":"rate(cache_misses_total{application=\"bookstore-api\"}[5m])"}],"gridPos":{"h":8,"w":12,"x":12,"y":16}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  alerting.yaml: |
    apiVersion: 1
    contactPoints:
      - name: pagerduty
        settings:
          integrationKey: CHANGE_ME
        type: pagerduty
    policies:
      - contactPoint: pagerduty
        groupBy:
          - severity
        groupInterval: 5m
        groupWait: 30s
        receiver: pagerduty
        repeatInterval: 4h

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
    - seriesQuery: |
        rate(http_server_requests_seconds_count{application="bookstore",namespace="bookstore"}[1m])
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "http_server_requests_seconds_count"
        as: "http_requests_per_second"
      metricsQuery: |
        sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)

    - seriesQuery: |
        rate(http_server_requests_seconds_sum{application="bookstore",namespace="bookstore",status=~"5.."}[1m])
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "http_server_requests_seconds_sum"
        as: "http_errors_per_second"
      metricsQuery: |
        sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)

    - seriesQuery: |
        jvm_memory_used_bytes{application="bookstore",area="heap"}
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "jvm_memory_used_bytes"
        as: "jvm_heap_usage_bytes"
      metricsQuery: |
        sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)

    - seriesQuery: |
        bookstore_messaging_events_published_total{application="bookstore"}
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "bookstore_messaging_events_published_total"
        as: "events_published_total"
      metricsQuery: |
        sum(rate(<<.Series>>{<<.LabelMatchers>>}[5m])) by (<<.GroupBy>>)

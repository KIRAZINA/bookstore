# ============================================================
# Monitoring Stack — Kustomization
# ============================================================
# Deploys Prometheus, Grafana, and Tempo into the monitoring namespace
#
# For production, consider:
# - Prometheus Operator (for CRD-based monitoring configuration)
# - Grafana Operator (for dashboard CRDs)
# - Grafana Cloud or Grafana Enterprise (managed, for multi-cluster)
# - Tempo (for distributed tracing backend)
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

commonLabels:
  app.kubernetes.io/part-of: bookstore-platform
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - prometheus-deployment.yaml
  - prometheus-service.yaml
  - prometheus-config.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - tempo-deployment.yaml
  - tempo-service.yaml

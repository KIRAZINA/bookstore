apiVersion: v1
kind: Service
metadata:
  name: bookstore
  namespace: bookstore
  labels:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api
  annotations:
    # Prometheus operator auto-discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/actuator/prometheus"
    # AWS NLB annotations (future)
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: ClusterIP
  # ClusterIP: internal-only access
  # External traffic enters through Ingress
  ports:
    # Application traffic port
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    # Management/Actuator port (separate port for security)
    # Allows Prometheus to scrape metrics without exposing application endpoints
    - name: management
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api

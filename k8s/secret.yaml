# ============================================================
# Bookstore Secrets Template
# ============================================================
# IMPORTANT: This is a TEMPLATE file for documentation purposes.
# DO NOT use this file directly in production.
#
# Production secrets MUST be managed via:
# 1. External Secrets Operator (recommended)
# 2. Cloud-native secret managers:
#    - AWS: Secrets Manager / Parameter Store
#    - Azure: Key Vault
#    - GCP: Secret Manager
# 3. HashiCorp Vault (via CSI provider or Vault Agent Injector)
#
# The ExternalSecret resource below shows the production pattern.
# ============================================================

# --- Development-only placeholder ---
# This is ONLY used for local development clusters (kind, minikube).
# In production, delete this resource and use ExternalSecret below.
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-secrets
  namespace: bookstore
  labels:
    app.kubernetes.io/name: bookstore
    app.kubernetes.io/component: api
  annotations:
    # Prevent secrets from being applied to production clusters
    # via helm or ArgoCD ignore diffs
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    # Mark as non-production
    bookstore/non-production: "true"
type: Opaque
stringData:
  # Database credentials
  DATASOURCE_URL: "jdbc:postgresql://bookstore-postgres:5432/bookstore"
  DATASOURCE_USERNAME: "bookstore"
  DATASOURCE_PASSWORD: "bookstore"

  # Redis credentials
  REDIS_HOST: "bookstore-redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # Kafka connection
  KAFKA_BOOTSTRAP_SERVERS: "bookstore-kafka:9092"

  # JWT signing secret (min 256-bit key for HS256)
  JWT_SECRET: "local-development-jwt-secret-key-that-is-at-least-256-bits-long"

  # CORS
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"

---

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
  - ../../namespace.yaml
  - ../../serviceaccount.yaml
  - ../../configmap.yaml
  - ../../secret.yaml  # non-JWT secrets only; JWT_SECRET is provisioned out-of-band
  - ../../priorityclass.yaml
  - ../../pdb.yaml
  - ../../deployment.yaml
  - ../../service.yaml
  - ../../networkpolicy.yaml
  - ../../ingress.yaml
  - ../../hpa.yaml
  - ../../resourcequota.yaml

commonLabels:
  app.kubernetes.io/name: bookstore
  app.kubernetes.io/part-of: bookstore-platform
  app.kubernetes.io/managed-by: kustomize
  environment: dev

commonAnnotations:
  app.kubernetes.io/repository: "https://github.com/example/bookstore"

images:
  - name: bookstore
    newName: bookstore-api
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: bookstore
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: bookstore-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: PodDisruptionBudget
      name: bookstore-pdb
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
